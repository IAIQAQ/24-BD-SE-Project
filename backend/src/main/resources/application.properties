server.address=127.0.0.1
server.port=${MATHDRILL_PORT:18443}
server.ssl.enabled=${MATHDRILL_TLS:true}
server.ssl.key-store=${MATHDRILL_KEYSTORE}
server.ssl.key-store-password=${MATHDRILL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
spring.datasource.url=${MATHDRILL_DB_URL}
spring.datasource.username=${MATHDRILL_DB_USER}
spring.datasource.password=${MATHDRILL_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.session.timeout=30m
spring.session.jdbc.initialize-schema=always
server.servlet.session.cookie.name=MATHDRILL_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.flyway.enabled=true
mathdrill.cors-origins=${MATHDRILL_CORS_ORIGINS:https://localhost,http://127.0.0.1:5173,http://localhost:5173}
mathdrill.seed-enabled=${MATHDRILL_SEED_ENABLED:false}
mathdrill.seed-password=${MATHDRILL_SEED_PASSWORD:}
